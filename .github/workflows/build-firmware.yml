name: Build and publish ESP32 firmware
on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/build-firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/build-firmware.yml'
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build ESP32-S3 firmware
        run: pio run -d firmware -e bandana_s3
      - name: Publish OTA image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp firmware/.pio/build/bandana_s3/firmware.bin firmware.bin
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add firmware.bin
          if git diff --cached --quiet; then
            echo 'OTA image unchanged'
            exit 0
          fi
          git commit -m 'Publish ESP32-S3 OTA firmware'
          git push
